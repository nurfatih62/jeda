<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEDA - Ambil Jeda dan Mulai Membaca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@700&family=Poppins:wght@500;700&family=Nunito:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF8F2;
    --teal: #198876;
    --teal-border: #147364;
    --teal-dark: #1B4E46;
    --teal-muted: rgba(27,78,70,0.75);
    --header-bg: rgba(25,136,118,0.04);
    --card-border: rgba(27,78,70,0.52);
    --placeholder: #C2C7D0;
    --white: #FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Poppins', sans-serif;
    background: var(--bg);
    color: var(--teal-dark);
  }

  /* ===== HEADER ===== */
  header{
    display:flex;
    align-items:center;
    gap:31px;
    padding:10px 21px;
    height:84px;
    background: var(--header-bg);
    border: 1px solid var(--teal-border);
  }
  .hamburger{
    display:flex;
    justify-content:center;
    align-items:center;
    width:46px;
    height:44px;
    padding:8px;
    border-radius:6px;
    border:none;
    background:transparent;
    cursor:pointer;
    flex-shrink:0;
  }
  .hamburger svg{ width:24px; height:24px; }
  .logo{
    font-family:'IBM Plex Serif', serif;
    font-weight:700;
    font-size:24px;
    line-height:28px;
    color: var(--teal);
    flex-shrink:0;
  }
  .search-bar{
    flex:1;
    max-width:1062px;
    display:flex;
    align-items:center;
    gap:10px;
    height:40px;
    background: var(--white);
    border:1px solid var(--teal);
    border-radius:8px;
    padding:10px 16px;
  }
  .search-bar svg{ width:20px; height:20px; stroke:var(--teal); flex-shrink:0; }
  .search-bar input{
    border:none;
    outline:none;
    flex:1;
    font-family:'Nunito', sans-serif;
    font-weight:500;
    font-size:14px;
    line-height:20px;
    background:transparent;
    color:var(--teal-dark);
  }
  .search-bar input::placeholder{ color:var(--placeholder); }

  .btn{
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:16px;
    line-height:24px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 16px;
    height:40px;
  }
  .btn-primary{ background:var(--teal); color:var(--white); width:100px; flex-shrink:0; }
  .btn-primary:hover{ background:#147364; }
  .btn-outline{ background:transparent; color:var(--teal); border:1px solid var(--teal); width:140px; }
  .btn-outline:hover{ background:rgba(25,136,118,0.06); }
  .btn-daftar{ background:var(--teal); color:var(--white); width:105px; }
  .btn-daftar:hover{ background:#147364; }

  /* ===== HERO ===== */
  .hero{
    text-align:center;
    padding:56px 21px 25px;
    max-width:1036px;
    margin:0 auto;
  }
  .hero h1{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:36px;
    line-height:1.3;
    color: var(--teal-dark);
    margin-bottom:22px;
  }
  .hero h1 .accent{ color:var(--teal); }
  .hero p{
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:24px;
    line-height:28px;
    color: var(--teal-muted);
    margin-bottom:24px;
  }
  .hero-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
  }

  /* ===== TABS ===== */
  .container{
    max-width:1364px;
    margin:0 auto;
    padding:0 46px;
  }
  .tabs-wrap{
    padding-top:31px;
  }
  .tabs{
    display:flex;
    align-items:center;
    gap:10px;
    padding-bottom:0;
  }
  .tab{
    background:none;
    border:none;
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:16px;
    line-height:24px;
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
    color: var(--teal);
    opacity:0.5;
  }
  .tab.active{
    color: var(--teal-dark);
    opacity:1;
  }
  .tabs-baseline{
    height:1px;
    background: var(--teal-border);
    position:relative;
    margin-bottom:24px;
  }
  .tabs-indicator{
    position:absolute;
    left:0;
    top:-1px;
    width:122px;
    height:3px;
    background: var(--teal);
    transition: left 0.2s ease;
  }

  /* ===== ARTICLE LIST ===== */
  .article-list{
    display:flex;
    flex-direction:column;
    gap:24px;
    padding-bottom:60px;
  }
  .article-card{
    position:relative;
    display:flex;
    gap:8px;
    min-height:197px;
    background: var(--bg);
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:16px 18px;
  }
  .avatar{
    width:40px;
    height:40px;
    border-radius:24px;
    object-fit:cover;
    flex-shrink:0;
  }
  .article-body{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .article-content{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .article-meta{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    font-size:14px;
    line-height:28px;
    color: var(--teal-muted);
  }
  .article-meta .dot{
    width:4px;
    height:4px;
    border-radius:50%;
    background: var(--teal);
    flex-shrink:0;
  }
  .article-meta .date{ font-weight:500; }
  .article-content h2{
    font-weight:700;
    font-size:24px;
    line-height:26px;
    color: var(--teal-dark);
  }
  .article-content p{
    font-weight:500;
    font-size:16px;
    line-height:24px;
    color: var(--teal-muted);
    max-width:712px;
  }
  .article-actions{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .action-item{
    display:flex;
    align-items:center;
    gap:7px;
    font-weight:500;
    font-size:16px;
    line-height:24px;
    color: var(--teal-muted);
  }
  .action-item svg, .icon-btn svg{ width:24px; height:24px; stroke:var(--teal-muted); }
  .article-actions .spacer{ flex:1; }
  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    opacity:0.9;
  }
  .icon-btn:hover{ opacity:1; }
  .article-image{
    position:absolute;
    top:16px;
    right:18px;
    width:299px;
    height:165px;
    border-radius:8px;
    overflow:hidden;
  }
  .article-image img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .article-body{ padding-right:315px; }

  @media (max-width: 900px){
    header{ flex-wrap:wrap; height:auto; }
    .search-bar{ order:3; max-width:100%; }
    .hero h1{ font-size:28px; }
    .hero p{ font-size:17px; }
    .article-card{ flex-direction:column; }
    .article-body{ padding-right:0; }
    .article-image{ position:static; width:100%; height:200px; order:-1; }
    .container{ padding:0 20px; }
  }
</style>
</head>
<body>

<header>
  <button class="hamburger" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="#198876" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="logo">JEDA</div>
  <div class="search-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="#198876" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="Cari">
  </div>
  <button class="btn btn-primary">Masuk</button>
</header>

<section class="hero">
  <h1>Ambil <span class="accent">JEDA</span> dan mulai membaca</h1>
  <p>Ayo bergabung untuk mendapatkan pengalaman lebih lengkap dengan <span style="color:var(--teal-dark); font-weight:700;">JEDA</span> dan mulai bacaanmu</p>
  <div class="hero-buttons">
    <button class="btn btn-outline">Jelajahi dulu</button>
    <button class="btn btn-daftar">Daftar</button>
  </div>
</section>

<div class="container">
  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab active" data-tab="populer">Populer</button>
      <button class="tab" data-tab="terbaru">Terbaru</button>
    </div>
    <div class="tabs-baseline">
      <div class="tabs-indicator" id="tabIndicator"></div>
    </div>
  </div>

  <div class="article-list" id="articleList"></div>
</div>

<script>
  const ICONS = {
    like: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>`,
    comment: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
    share: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,
    flag: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>`
  };

  const articles = [
    { author: "Asya mc", date: "15 Agustus 2026", title: "Lorem ipsum dolor sit amet",
      desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam",
      likes: 237, comments: 12,
      avatar: "https://i.pravatar.cc/80?img=13",
      image: "https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=600&h=400&fit=crop" },
    { author: "Asya mc", date: "15 Agustus 2026", title: "Lorem ipsum dolor sit amet",
      desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam",
      likes: 237, comments: 12,
      avatar: "https://i.pravatar.cc/80?img=13",
      image: "https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=600&h=400&fit=crop" },
    { author: "Asya mc", date: "15 Agustus 2026", title: "Lorem ipsum dolor sit amet",
      desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam",
      likes: 237, comments: 12,
      avatar: "https://i.pravatar.cc/80?img=13",
      image: "https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=600&h=400&fit=crop" }
  ];

  function renderArticles(list){
    const container = document.getElementById('articleList');
    container.innerHTML = list.map(a => `
      <article class="article-card">
        <img class="avatar" src="${a.avatar}" alt="${a.author}">
        <div class="article-body">
          <div class="article-content">
            <div class="article-meta">
              <span>${a.author}</span>
              <span class="dot"></span>
              <span class="date">${a.date}</span>
            </div>
            <h2>${a.title}</h2>
            <p>${a.desc}</p>
          </div>
          <div class="article-actions">
            <span class="action-item">${ICONS.like} ${a.likes}</span>
            <span class="action-item">${ICONS.comment} ${a.comments}</span>
            <span class="spacer"></span>
            <button class="icon-btn" title="Bagikan">${ICONS.share}</button>
            <button class="icon-btn" title="Laporkan">${ICONS.flag}</button>
          </div>
        </div>
        <div class="article-image">
          <img src="${a.image}" alt="${a.title}">
        </div>
      </article>
    `).join('');
  }

  renderArticles(articles);

  const tabs = document.querySelectorAll('.tab');
  const indicator = document.getElementById('tabIndicator');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      indicator.style.left = tab.offsetLeft + 'px';
      renderArticles(articles);
    });
  });
</script>

</body>
</html>
